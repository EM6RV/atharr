# يزور قاعدة بيانات Supabase كل يومين، باش المشروع المجاني ما يتوقفش لو قعد أسبوع بدون زوار.
# ملاحظة: GitHub يوقف المهام المجدولة لو المستودع قعد 60 يوم بدون أي تعديل — لو صار هكي، فعّلها من تبويب Actions.
name: Supabase keep-alive
on:
  schedule:
    - cron: "17 6 */2 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase
        run: |
          URL=$(grep -oE "https://[a-z0-9]+\.supabase\.co" config.js | head -1)
          KEY=$(grep -oE "eyJ[A-Za-z0-9._-]+" config.js | head -1)
          code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/rest/v1/products?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Supabase responded: $code"
          test "$code" = "200"
